<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红楼梦 · 知识探索工具</title>
  <meta name="description" content="红楼梦知识探索工具：关系图谱、家族谱系、人物名录与诗词典故知识库，边读边查。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>">
  <!-- 数据文件的内容版本：由 npm run stamp 与资源版本号一起更新，
       否则浏览器会一直复用旧的 characters.json / knowledge.json。 -->
  <meta name="hlm-asset-version" content="8a46320c22">
  <link rel="stylesheet" href="css/fonts.css?v=8a46320c22">
  <link rel="stylesheet" href="css/style.css?v=8a46320c22">
  <!-- 装饰性标题字体不阻塞首屏；加载完成后再应用，正文先用 Noto Serif。 -->
  <link rel="stylesheet" href="css/display-font.css?v=8a46320c22" media="print" onload="this.media='all'">
  <script src="js/d3.v7.min.js?v=8a46320c22"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-title">红楼梦</div>
    <div class="loading-subtitle">正在整理人物脉络与关系线索……</div>
    <div class="loading-spinner"></div>
  </div>

  <header class="header">
    <div class="header-left">
      <button id="sidebar-toggle" class="btn-sidebar-toggle" aria-label="切换侧边栏" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div>
        <h1 class="header-title">红楼梦 · 知识探索工具</h1>
        <div class="header-subtitle">图谱 · 族谱 · 名录 · 回目 · 知识库</div>
      </div>
    </div>

    <div class="header-center">
      <nav class="view-nav" id="view-nav" role="tablist" aria-label="视图切换">
        <button class="view-nav-tab active" data-view="graph" data-short="图谱" role="tab" aria-selected="true" aria-controls="view-graph"><span class="view-nav-icon">◉</span><span class="view-nav-label">关系图谱</span></button>
        <button class="view-nav-tab" data-view="tree" tabindex="-1" data-short="族谱" role="tab" aria-selected="false" aria-controls="view-tree"><span class="view-nav-icon">🌳</span><span class="view-nav-label">家族谱系</span></button>
        <button class="view-nav-tab" data-view="list" tabindex="-1" data-short="名录" role="tab" aria-selected="false" aria-controls="view-list"><span class="view-nav-icon">📋</span><span class="view-nav-label">人物名录</span></button>
        <button class="view-nav-tab" data-view="chapter" tabindex="-1" data-short="回目" role="tab" aria-selected="false" aria-controls="view-chapter"><span class="view-nav-icon">📚</span><span class="view-nav-label">回目视图</span></button>
        <button class="view-nav-tab" data-view="knowledge" tabindex="-1" data-short="知识" role="tab" aria-selected="false" aria-controls="view-knowledge"><span class="view-nav-icon">📖</span><span class="view-nav-label">知识库</span></button>
      </nav>
    </div>

    <div class="header-right" id="header-right">
      <button id="global-search-toggle" class="header-search-btn" type="button" aria-label="全站搜索" aria-expanded="false" title="全站搜索">🔍</button>
      <!-- Theme & font controls injected here by JS -->
    </div>
  </header>

  <section class="global-context-bar" id="global-context-bar" aria-label="当前探索上下文">
    <div class="context-facets" id="context-facets"></div>
    <div class="context-actions">
      <button id="btn-clear-context" class="text-action">清空上下文</button>
    </div>
  </section>

  <div class="main-container" id="main-content" tabindex="-1">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <section class="sidebar-section sidebar-priority-block" id="recent-characters-section" style="display:none">
        <div class="sidebar-section-title">最近浏览</div>
        <div id="recent-characters" class="quick-grid"></div>
      </section>

      <section class="sidebar-section sidebar-filter-section">
        <div class="sidebar-section-title">筛选与比较</div>

        <section class="sidebar-subsection">
          <div class="sidebar-section-title">家族筛选</div>
          <div id="family-filters" class="family-filter"></div>
        </section>

        <section class="sidebar-subsection">
          <div class="sidebar-section-title">关系类型</div>
          <div id="relation-filters" class="relation-filter"></div>
        </section>

        <section class="sidebar-subsection sidebar-filter-summary" id="graph-filter-summary" aria-live="polite"></section>

        <details class="sidebar-advanced-details">
          <summary class="sidebar-advanced-summary">进阶选项</summary>
          <div class="sidebar-advanced-content">
            <section class="sidebar-subsection">
              <div class="sidebar-section-title">人物重要度</div>
              <div id="importance-filters" class="importance-filter"></div>
            </section>

            <section class="sidebar-subsection">
              <div class="sidebar-section-title">人物对比</div>
              <div class="compare-inputs compare-inputs-sidebar">
                <select id="compare-left" aria-label="选择人物 A"></select>
                <span class="compare-sep">↔</span>
                <select id="compare-right" aria-label="选择人物 B"></select>
                <button id="btn-run-compare" class="secondary-action">查看关系</button>
              </div>
              <div class="compare-actions">
                <button id="btn-compare-current" class="text-action sidebar-compare-current">用当前人物发起对比</button>
                <button id="btn-find-path" class="text-action" title="查找两个人物之间的最短关系链">🔍 查找路径</button>
              </div>
            </section>

            <section class="sidebar-subsection compact-legend">
              <details class="legend-toggle">
                <summary class="sidebar-section-title">图例</summary>
                <div class="legend-section">
                  <div class="legend-item"><div class="legend-line" style="background:#4A6B8A"></div><span>血缘</span></div>
                  <div class="legend-item"><div class="legend-line" style="background:#B83232"></div><span>婚姻</span></div>
                  <div class="legend-item"><div class="legend-line" style="background:#95A5A6"></div><span>主仆</span></div>
                  <div class="legend-item"><div class="legend-line legend-dashed" style="border-color:#C75B6E"></div><span>情感</span></div>
                  <div class="legend-item"><div class="legend-line legend-dashed" style="border-color:#C49A2A"></div><span>社交</span></div>
                  <div class="legend-item"><div class="legend-line legend-dotted" style="border-color:#8E44AD"></div><span>敌对</span></div>
                  <div class="legend-note">连线可点击：查看关系考据与回目依据</div>
                </div>
              </details>
            </section>
          </div>
        </details>
      </section>

      <div id="sidebar-search-results" class="sidebar-search-results"></div>
    </aside>

    <div id="sidebar-resize-handle" class="sidebar-resize-handle" aria-hidden="true"></div>

    <main class="content-area">
      <!-- Graph View (default) -->
      <section class="graph-stage view-panel active" id="view-graph" role="tabpanel" aria-label="关系图谱">
        <div id="graph-container" class="graph-container">
          <div id="mode-indicator" class="mode-indicator">
            <span id="mode-name">聚焦模式</span>
            <button id="btn-exit-focus" class="exit-btn">退出聚焦</button>
          </div>

          <div class="controls-panel">
            <div class="controls-core">
              <button id="btn-zoom-in" class="control-btn" title="放大" aria-label="放大图谱">＋</button>
              <button id="btn-zoom-out" class="control-btn" title="缩小" aria-label="缩小图谱">－</button>
              <button id="btn-reset" class="control-btn" title="重置视图" aria-label="重置图谱视图">⟲</button>
              <button id="btn-toggle-labels" class="control-btn active" title="切换标签" aria-label="切换人物标签" aria-pressed="true">字</button>
            </div>
            <div class="controls-overflow">
              <button id="btn-controls-more" class="control-btn controls-more-btn" title="更多控制" aria-label="更多图谱控制" aria-expanded="false" aria-controls="controls-overflow-menu">⋯</button>
              <div class="controls-overflow-menu" id="controls-overflow-menu" role="menu" aria-label="更多图谱控制">
                <button id="btn-toggle-cluster" class="control-btn" role="menuitem" title="按关系聚类" aria-label="按关系聚类">🔗</button>
                <button id="btn-toggle-particles" class="control-btn" role="menuitem" title="粒子动画" aria-label="粒子动画">✨</button>
                <button id="btn-graph-fullscreen" class="control-btn" role="menuitem" title="大图模式" aria-label="大图模式">⛶</button>
                <button id="btn-export-png" class="control-btn" role="menuitem" title="导出图谱为PNG图片" aria-label="导出图谱为PNG图片">📷</button>
                <button id="btn-share-card" class="control-btn" role="menuitem" title="生成分享卡片" aria-label="生成分享卡片">📤</button>
              </div>
            </div>
          </div>
          <div id="graph-floating-bar" class="graph-floating-bar">
            <div class="graph-search-area">
              <div class="graph-search-box">
                <span class="graph-search-icon">🔍</span>
                <div class="search-input-wrapper">
                  <input
                    id="graph-search-input"
                    class="graph-search-input"
                    type="text"
                    placeholder="搜索人物、知识、章回或关系"
                    autocomplete="off"
                    aria-label="搜索人物、知识、章回或关系"
                    role="searchbox"
                  >
                  <button type="button" class="btn-clear-search" title="清空搜索">×</button>
                </div>
                <div id="graph-search-results" class="graph-search-results"></div>
              </div>
              <button id="btn-back" class="graph-action-btn hidden" title="返回上一视图">← 返回</button>
              <button id="btn-explore-start" class="graph-action-btn" title="从一个人物开始探索">从人物开始</button>
              <button id="btn-exit-focus-bar" class="graph-action-btn hidden" title="退出聚焦模式">退出聚焦</button>
              <button id="btn-full-view" class="graph-action-btn" title="显示全部人物关系网">显示全部</button>
              <button id="btn-random" class="graph-action-btn" title="随机探索一个人物或知识条目">🎲 随缘</button>
            </div>
            <div class="graph-floating-info">
              <div class="graph-importance-quick" id="importance-quick" role="group" aria-label="人物重要度切换">
                <button class="importance-quick-btn active" data-level="4" title="核心人物（重要度 4-5）">核心</button>
                <button class="importance-quick-btn" data-level="3" title="主要人物（重要度 3+）">主要</button>
                <button class="importance-quick-btn" data-level="2" title="扩展人物（重要度 2+）">扩展</button>
                <button class="importance-quick-btn" data-level="1" title="全部有名人物">全部</button>
                <button id="graph-help-btn" class="graph-help-btn" type="button" aria-label="查看图谱模式与时间线说明" title="查看图谱模式与时间线说明">?</button>
              </div>
              <div id="fullscreen-view-label" class="graph-floating-label">默认概览</div>
            </div>
            <div class="graph-floating-actions">
              <button id="btn-exit-fullscreen" class="control-btn hidden" title="退出大图模式">✕</button>
            </div>
          </div>

          <div id="graph-hint" class="graph-hint">
            <span class="graph-hint-copy graph-hint-copy-desktop">拖拽移动 · 滚轮缩放 · 点击连线看考据 · 双击聚焦</span>
            <span class="graph-hint-copy graph-hint-copy-touch">单指拖动 · 双指缩放 · 点按节点看人物 · 双击聚焦</span>
            <button id="graph-hint-dismiss" class="graph-hint-dismiss">知道了</button>
          </div>

          <div id="timeline-slider" class="timeline-slider">
            <div class="timeline-header">
              <span class="timeline-label">章回时间线</span>
              <div class="timeline-controls">
                <select id="timeline-mode" class="timeline-select" aria-label="时间线模式" title="时间线模式：单回 / 累计">
                  <option value="single" selected>单回</option>
                  <option value="cumulative">累计</option>
                </select>
                <select id="timeline-speed" class="timeline-select" aria-label="播放速度" title="自动播放速度">
                  <option value="1400">慢速</option>
                  <option value="900" selected>标准</option>
                  <option value="500">快速</option>
                </select>
                <button id="btn-timeline-play" class="timeline-play-btn" title="自动播放（使用当前速度）">▶</button>
                <span id="timeline-chapter" class="timeline-chapter" title="当前章回范围">全部</span>
              </div>
            </div>
            <input type="range" id="timeline-range" class="timeline-range" min="0" max="120" value="0" step="1" aria-label="章回时间线滑块">
            <div class="timeline-marks">
              <span>1</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span><span>120</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Tree View -->
      <section class="view-panel" id="view-tree" role="tabpanel" aria-label="家族谱系">
        <div id="tree-container" class="tree-container"></div>
      </section>

      <!-- List View -->
      <section class="view-panel" id="view-list" role="tabpanel" aria-label="人物名录">
        <div id="list-container" class="list-container"></div>
      </section>

      <section class="view-panel" id="view-chapter" role="tabpanel" aria-label="回目视图">
        <div id="chapter-container" class="chapter-container"></div>
      </section>

      <!-- Knowledge View -->
      <section class="view-panel" id="view-knowledge" role="tabpanel" aria-label="知识库">
        <div id="knowledge-container" class="knowledge-container"></div>
      </section>

    </main>
  </div>

<!-- Discovery Panel (12金钗首页) -->
<div id="discovery-overlay" class="discovery-overlay" role="dialog" aria-label="金陵十二钗·探索入口" aria-modal="true" aria-hidden="true">
  <div class="discovery-content">
    <div class="discovery-header">
      <div class="discovery-title">金陵十二钗</div>
      <div class="discovery-subtitle">选择一位人物，开启你的红楼探索之旅</div>
      <button id="discovery-skip-btn" class="discovery-skip-btn">直接进入图谱 →</button>
    </div>
    <div class="discovery-cards" id="discovery-cards"></div>
    <div class="discovery-entries">
      <button class="discovery-entry-btn" id="discovery-topic-btn"><span class="discovery-entry-icon">🎭</span>专题探索</button>
      <button class="discovery-entry-btn" id="discovery-stage-btn"><span class="discovery-entry-icon">📖</span>阅读阶段</button>
      <button class="discovery-entry-btn" id="discovery-random-btn"><span class="discovery-entry-icon">🎲</span>随缘一探</button>
    </div>
    <div class="discovery-daily" id="discovery-daily"></div>
  </div>
</div>

<!-- Path Display Panel -->
<div id="path-display-panel" class="path-display-panel" role="status" aria-live="polite">
  <div class="path-panel-title">
    <span id="path-panel-label">关系路径</span>
    <button id="path-panel-close" class="path-panel-close" aria-label="关闭路径面板">✕</button>
  </div>
  <div id="path-chain" class="path-chain"></div>
</div>

<!-- Global search across all views -->
<div id="global-search-overlay" class="global-search-overlay" role="dialog" aria-modal="true" aria-label="全站搜索" aria-hidden="true">
  <div class="global-search-dialog">
    <div class="global-search-bar">
      <span class="global-search-icon" aria-hidden="true">🔍</span>
      <input id="global-search-input" class="global-search-input" type="text" placeholder="搜索人物、知识、章回、专题或阶段…" autocomplete="off" aria-label="全站搜索">
      <button id="global-search-close" class="global-search-close" type="button" aria-label="关闭全站搜索">✕</button>
    </div>
    <div class="global-search-filters" role="group" aria-label="搜索类型">
      <button type="button" class="global-search-filter active" data-search-type="all">全部</button>
      <button type="button" class="global-search-filter" data-search-type="character">人物</button>
      <button type="button" class="global-search-filter" data-search-type="knowledge">知识</button>
      <button type="button" class="global-search-filter" data-search-type="chapter">章回</button>
      <button type="button" class="global-search-filter" data-search-type="topic">专题</button>
    </div>
    <div id="global-search-status" class="global-search-status" role="status" aria-live="polite"></div>
    <div id="global-search-results" class="global-search-results" aria-live="polite"></div>
    <div class="global-search-hint">结果来自人物、知识、章回、专题和阅读阶段，点击可直接跳转。</div>
  </div>
</div>

<!-- Exploration Dialog (first-visit path, data policy, character pages) -->
<div id="exploration-overlay" class="exploration-overlay" role="dialog" aria-modal="true" aria-labelledby="exploration-title" aria-hidden="true">
  <div class="exploration-dialog" id="exploration-dialog" tabindex="-1"></div>
</div>

<!-- Character Detail Panel (slides in from right) -->
<div id="character-card-overlay" class="character-card-overlay" role="dialog" aria-modal="true" aria-label="人物详情" aria-hidden="true">
  <div id="card-content" class="character-card" tabindex="-1"></div>
</div>

  <script src="js/edge-tts.js?v=8a46320c22"></script>
  <script src="js/audio-preload-cache.js?v=8a46320c22"></script>
  <script src="js/utils.js?v=8a46320c22"></script>
  <script src="js/facet-store.js?v=8a46320c22"></script>
  <script src="js/text-layout.js?v=8a46320c22"></script>
  <script src="js/graph.js?v=8a46320c22"></script>
  <script src="js/tree-view.js?v=8a46320c22"></script>
  <script src="js/list-view.js?v=8a46320c22"></script>
  <script src="js/chapter-view.js?v=8a46320c22"></script>
  <!-- fuse.js 本地化：原先是唯一的外部运行时依赖，断网/公司网络下会静默降级为关键词匹配。
       用模块脚本加载，把默认导出挂到 window.Fuse，其余视图沿用全局访问方式。 -->
  <script type="module">
    try {
      const module = await import('./js/fuse.min.mjs?v=8a46320c22');
      window.Fuse = module.default;
    } catch (err) {
      console.warn('[fuse] 本地模块加载失败，知识库检索将退回关键词匹配', err);
    }
  </script>
  <script src="js/knowledge-view.js?v=8a46320c22"></script>
  <script src="js/app.js?v=8a46320c22"></script>
</body>
</html>
